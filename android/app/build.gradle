apply plugin: 'com.android.application'

android {
    namespace "com.dimetime.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dimetime.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version policy: keep versionName aligned with the iOS marketing
        // version and versionCode aligned with the iOS build number
        // (ios/App/App/Info.plist). Google Play requires versionCode to
        // strictly increase on every upload — never reuse or lower it.
        versionCode 212
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    // Release signing comes ONLY from environment variables (never from files
    // in the repo):
    // - KEYSTORE_FILE: Path to the upload keystore
    // - KEYSTORE_PASSWORD: Keystore password
    // - KEY_ALIAS: Key alias name
    // - KEY_PASSWORD: Key password
    //
    // Keystore generation (run OUTSIDE the repo; .gitignore blocks *.jks/*.keystore):
    // keytool -genkey -v -keystore release.keystore -alias dimetime -keyalg RSA -keysize 2048 -validity 10000
    //
    // Debug builds work without these vars. Release builds (assembleRelease /
    // bundleRelease) fail loudly without them — see the configureEach guard below.
    def hasReleaseSigning = System.getenv("KEYSTORE_FILE") && System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") && System.getenv("KEY_PASSWORD")

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    // Security requirement: never produce an unsigned or debug-signed release
    // artifact silently. If release credentials are missing, fail the release
    // build at execution time (debug builds and Gradle sync stay unaffected).
    tasks.configureEach { task ->
        if (!hasReleaseSigning && (task.name == "assembleRelease" || task.name == "bundleRelease" || task.name == "packageRelease" || task.name == "packageReleaseBundle")) {
            task.doFirst {
                throw new GradleException("Release signing requires KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD environment variables to be set")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        
        release {
            // Capacitor default is NO minification/resource shrinking.
            // Keep both OFF. Note: the instant launch crash in builds
            // 207/208 was NOT caused by minification — the real root
            // cause (confirmed via logcat, fixed in versionCode 209)
            // was a duplicate <domain>localhost</domain> declaration in
            // res/xml/network_security_config.xml, which Android's
            // XmlConfigSource parser treats as fatal at startup.
            // Minify/shrink stay disabled anyway (Capacitor template
            // default — one less variable). Do NOT re-enable without a
            // full on-device launch test of a signed release build; if
            // a launch crash ever recurs, capture the logcat FATAL
            // block BEFORE changing anything.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            debuggable false
            zipAlignEnabled true
            
            // App Bundle optimization
            bundle {
                language {
                    enableSplit = true
                }
                density {
                    enableSplit = true
                }
                abi {
                    enableSplit = true
                }
            }
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
