# 7. Build iOS archive with manual signing from Codemagic
- name: Build iOS archive
  script: |
    xcodebuild \
      -workspace "$XCODE_WORKSPACE" \
      -scheme "$XCODE_SCHEME" \
      -configuration Release \
      -archivePath build/ios/App.xcarchive \
      DEVELOPMENT_TEAM=8WZHH537SU \
      CODE_SIGN_STYLE=Manual \
      PROVISIONING_PROFILE_SPECIFIER="Dime Time App Store" \
      archive
