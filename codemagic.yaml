workflows:
  ios_build_info:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic iOS Build

    environment:
      ios_signing:
        provisioning_profiles:
          - Dime App Store
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:

      # 1. Install root dependencies
      - name: Install root dependencies
        script: npm ci

      # 2. Build frontend (Vite)
      - name: Build frontend (Vite)
        script: |
          cd client
          npm ci
          npm run build
          cd ..

      # 3. Build backend (server)
      - name: Build backend (server)
        script: |
          npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist

      # 4. Verify web assets exist
      - name: Verify web assets
        script: |
          echo "Checking dist/public..."
          if [ ! -f dist/public/index.html ]; then
            echo "❌ dist/public/index.html missing — Vite output path incorrect."
            ls -R dist
            exit 1
          fi
          echo "✔ dist/public found."

      # 5. Copy and sync web assets into iOS
      - name: Copy and Sync iOS
        script: |
          npx cap copy ios
          npx cap sync ios

      # 6. Set dynamic build number
      - name: Set build number
        script: |
          echo "Using build number: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist

      # 7. Install CocoaPods
      - name: Install CocoaPods
        script: cd ios/App && pod install

      # 8. Set up code signing
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      # 9. Build IPA
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
