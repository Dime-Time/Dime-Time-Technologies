workflows:
  ios_build_info:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic iOS Build

    environment:
      ios_signing:
        provisioning_profiles:
          - Dime App Store
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      # 1. Install root dependencies
      - name: Install dependencies
        script: npm ci

      # 2. Build frontend + backend all from root
      - name: Build app (Vite + server)
        script: npm run build

      # 3. Verify Vite actually built the frontend
      - name: Verify dist/public exists
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ ERROR: dist/public missing — Vite build failed."
            exit 1
          else
            echo "✔ dist/public found."
          fi

      # 4. Sync iOS with the new web assets
      - name: Sync iOS
        script: npx cap sync ios

      # 5. Update build numbers
      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 44" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist

      # 6. CocoaPods
      - name: Install CocoaPods
        script: cd ios/App && pod install

      # 7. Code signing
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      # 8. Build the IPA
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
