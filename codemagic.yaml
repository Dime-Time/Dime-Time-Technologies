workflows:
  ios_release:
    name: Dime Time – iOS IPA Build + TestFlight Upload (Apple ID)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

      # Code signing via Apple Developer Portal integration
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.dimetime.mobile"

      # Environment group that must contain:
      #   APPLE_ID
      #   APP_SPECIFIC_PASSWORD
      #   VITE_STRIPE_PUBLISHABLE_KEY  (pk_live_...) — baked into the client
      #     bundle by `npm run build`; the shipped IPA needs it for Stripe ACH.
      #     Value lives ONLY in this Codemagic group, never hardcoded here.
      #   (and any other iOS/App Store vars you use)
      groups:
        - ios_build_info

      vars:
        # Xcode project settings
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          set -e
          echo "=== Installing npm dependencies and syncing Capacitor ==="
          npm ci || npm install

          # Stripe publishable key must be present BEFORE `npm run build` — Vite
          # bakes VITE_STRIPE_PUBLISHABLE_KEY into the client bundle that ships
          # inside the IPA. Without it, the in-app "Connect bank" flow has no
          # Stripe key. Add it (pk_live_...) to the `ios_build_info` env group.
          if [ -z "$VITE_STRIPE_PUBLISHABLE_KEY" ]; then
            echo "FATAL: VITE_STRIPE_PUBLISHABLE_KEY is not set. Add it to the ios_build_info Codemagic environment group before building."
            exit 1
          fi
          case "$VITE_STRIPE_PUBLISHABLE_KEY" in
            pk_live_*|pk_test_*) echo "VITE_STRIPE_PUBLISHABLE_KEY present and well-formed.";;
            *) echo "FATAL: VITE_STRIPE_PUBLISHABLE_KEY does not look like a Stripe publishable key (expected pk_live_... or pk_test_...)."; exit 1;;
          esac

          npm run build
          npx cap sync ios

          echo "=== Installing CocoaPods dependencies ==="
          bundle install || true
          cd ios/App
          pod install --repo-update
          cd ../../

      - name: Apply Codemagic signing profiles to Xcode project
        script: |
          set -e
          echo "=== Applying Codemagic signing profiles ==="
          xcode-project use-profiles

      - name: Verify iOS build number from Info.plist (NO OVERWRITE)
        script: |
          set -e
          cd ios/App

          # SOURCE OF TRUTH: ios/App/App/Info.plist's CFBundleVersion
          # is authoritative. This step ONLY reads + verifies — it does
          # NOT overwrite (previous versions of this script hardcoded
          # 110 and 200, which caused April + May 2026 upload rejections).
          #
          # To bump the build number for a new TestFlight release:
          #   1) Bump CFBundleVersion in ios/App/App/Info.plist
          #   2) (optional but recommended) bump CURRENT_PROJECT_VERSION
          #      in ios/App/App.xcodeproj/project.pbxproj to match
          #   3) commit, push, trigger Codemagic

          CURRENT_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "App/Info.plist")
          CURRENT_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "App/Info.plist")

          echo "=== Info.plist authoritative values ==="
          echo "    CFBundleShortVersionString = $CURRENT_SHORT_VERSION"
          echo "    CFBundleVersion            = $CURRENT_BUILD_NUMBER"

          # Hard guard against shipping a build <= the last one Apple has on
          # file. Update LAST_ACCEPTED_BY_APPLE whenever a build is accepted.
          LAST_ACCEPTED_BY_APPLE=206
          if [ "$CURRENT_BUILD_NUMBER" -le "$LAST_ACCEPTED_BY_APPLE" ]; then
            echo "FATAL: CFBundleVersion ($CURRENT_BUILD_NUMBER) must be strictly greater than the last value Apple accepted ($LAST_ACCEPTED_BY_APPLE)."
            echo "       Bump CFBundleVersion in ios/App/App/Info.plist, commit, push, and re-trigger."
            exit 1
          fi

          # Defensive: also propagate to project.pbxproj's CURRENT_PROJECT_VERSION
          # via agvtool so xcodebuild reads a consistent value (without changing it).
          /usr/bin/xcrun agvtool new-version -all "$CURRENT_BUILD_NUMBER"

          echo "=== Verifying Info.plist was NOT mutated by agvtool ==="
          FINAL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "App/Info.plist")
          if [ "$FINAL_BUILD_NUMBER" != "$CURRENT_BUILD_NUMBER" ]; then
            echo "FATAL: agvtool unexpectedly changed CFBundleVersion from $CURRENT_BUILD_NUMBER to $FINAL_BUILD_NUMBER"
            exit 1
          fi
          echo "    CFBundleVersion confirmed = $FINAL_BUILD_NUMBER"

      - name: Build and export IPA
        script: |
          set -e
          echo "=== Building IPA with xcode-project build-ipa ==="
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Inspect final IPA metadata (fail closed if build number is stale)
        script: |
          set -e
          IPA_PATH="build/ios/ipa/App.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "FATAL: IPA not found at $IPA_PATH"
            ls -R build || true
            exit 1
          fi

          echo "=== Extracting Info.plist from the built IPA ==="
          WORK_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$WORK_DIR"
          BUILT_PLIST="$WORK_DIR/Payload/App.app/Info.plist"

          if [ ! -f "$BUILT_PLIST" ]; then
            echo "FATAL: Info.plist not found inside the IPA at $BUILT_PLIST"
            find "$WORK_DIR" -name Info.plist
            exit 1
          fi

          # IPA Info.plist is binary plist — convert to xml1 for PlistBuddy
          plutil -convert xml1 "$BUILT_PLIST"

          IPA_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$BUILT_PLIST")
          IPA_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$BUILT_PLIST")

          echo "=== IPA metadata (what Apple will see) ==="
          echo "    CFBundleShortVersionString = $IPA_SHORT_VERSION"
          echo "    CFBundleVersion            = $IPA_BUILD_NUMBER"

          LAST_ACCEPTED_BY_APPLE=206
          if [ "$IPA_BUILD_NUMBER" -le "$LAST_ACCEPTED_BY_APPLE" ]; then
            echo "FATAL: Final IPA CFBundleVersion ($IPA_BUILD_NUMBER) is not strictly greater than the last value Apple accepted ($LAST_ACCEPTED_BY_APPLE)."
            echo "       Apple WILL reject this upload. Aborting before we waste an altool round-trip."
            exit 1
          fi
          echo "    Build number gate passed: $IPA_BUILD_NUMBER > $LAST_ACCEPTED_BY_APPLE"

      - name: Upload IPA to App Store Connect (TestFlight, Apple ID)
        script: |
          set -e
          echo "=== Uploading App.ipa to App Store Connect (TestFlight, Apple ID) ==="

          if [ -z "$APPLE_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ]; then
            echo "ERROR: APPLE_ID or APP_SPECIFIC_PASSWORD is not set."
            exit 1
          fi

          IPA_PATH="build/ios/ipa/App.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA not found at $IPA_PATH"
            ls -R build || true
            exit 1
          fi

          echo "Using APPLE_ID: ********"
          ALTOOL_PATH="$(xcrun --find altool || echo '/Applications/Xcode-26.1.app/Contents/SharedFrameworks/ContentDelivery.framework/Resources/altool')"
          echo "Using altool at: $ALTOOL_PATH"

          "$ALTOOL_PATH" --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_SPECIFIC_PASSWORD" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/**

  android_release:
    name: Dime Time – Android AAB Build (Google Play)
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      java: 17

      # Environment group that must contain:
      #   ANDROID_KEYSTORE_BASE64  — base64 of your release.keystore file
      #     (generate once: keytool -genkey -v -keystore release.keystore \
      #       -alias dimetime -keyalg RSA -keysize 2048 -validity 10000
      #      then: base64 -w0 release.keystore  → paste the output as this var)
      #     ⚠️  KEEP THE ORIGINAL release.keystore FOREVER + BACK IT UP.
      #         Lose it and you can never update the app on Google Play.
      #   KEYSTORE_PASSWORD        — the keystore password you chose
      #   KEY_ALIAS                — the key alias (e.g. "dimetime")
      #   KEY_PASSWORD             — the key password you chose
      #   VITE_STRIPE_PUBLISHABLE_KEY (pk_live_...) — baked into the client
      #     bundle by `npm run build`; the shipped AAB needs it for Stripe ACH.
      #     Value lives ONLY in this Codemagic group, never hardcoded here.
      groups:
        - android_build_info

    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          set -e
          echo "=== Installing npm dependencies and syncing Capacitor ==="
          npm ci || npm install

          # Stripe publishable key must be present BEFORE `npm run build` — Vite
          # bakes VITE_STRIPE_PUBLISHABLE_KEY into the client bundle that ships
          # inside the AAB. Without it, the in-app "Connect bank" flow has no
          # Stripe key. Add it (pk_live_...) to the `android_build_info` env group.
          if [ -z "$VITE_STRIPE_PUBLISHABLE_KEY" ]; then
            echo "FATAL: VITE_STRIPE_PUBLISHABLE_KEY is not set. Add it to the android_build_info Codemagic environment group before building."
            exit 1
          fi
          case "$VITE_STRIPE_PUBLISHABLE_KEY" in
            pk_live_*|pk_test_*) echo "VITE_STRIPE_PUBLISHABLE_KEY present and well-formed.";;
            *) echo "FATAL: VITE_STRIPE_PUBLISHABLE_KEY does not look like a Stripe publishable key (expected pk_live_... or pk_test_...)."; exit 1;;
          esac

          npm run build
          npx cap sync android

      - name: Build signed Android App Bundle (AAB)
        script: |
          set -e

          # All four signing values must be present — android/app/build.gradle
          # fails the build if any are missing (security requirement).
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "FATAL: Missing one or more Android signing vars (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            echo "       Add them to the android_build_info Codemagic environment group."
            exit 1
          fi

          # Decode the keystore to a file and point build.gradle at it.
          # KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD are read by
          # the release signingConfig in android/app/build.gradle.
          export KEYSTORE_FILE="$CM_BUILD_DIR/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          echo "=== Building signed release AAB ==="
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify the built AAB exists
        script: |
          set -e
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "FATAL: AAB not found at $AAB_PATH"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "=== AAB built successfully ==="
          ls -lh "$AAB_PATH"
          echo "Download this .aab from the Codemagic artifacts and upload it in the Google Play Console (Production or Internal testing)."

    # NOTE: The FIRST upload to Google Play must be done MANUALLY through the
    # Play Console — automated publishing can't create a brand-new app listing.
    # Download the .aab artifact below and upload it by hand the first time.
    # After the app exists in Play, we can add a `publishing: google_play:` block
    # here (needs a Google service-account JSON) to automate future uploads.
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
