workflows:
  ios_build_info:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic iOS Build

    environment:
      ios_signing:
        provisioning_profiles:
          - Dime App Store
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      # 1. Install root dependencies
      - name: Install root dependencies
        script: npm ci

      # 2. Build frontend (Vite) from /client
      - name: Build frontend (Vite)
        script: |
          cd client
          npm ci
          npm run build
          cd ..

      # 3. Build backend output
      - name: Build backend (server)
        script: |
          npm install
          esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist

      # 4. Verify that dist/public exists
      - name: Verify web assets exist
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ dist/public missing — Vite build failed."
            exit 1
          else
            echo "✔ dist/public found."
          fi

      # 5. Sync iOS (Capacitor)
      - name: Sync iOS
        script: |
          npx cap sync ios

      # 6. Build IPA
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
