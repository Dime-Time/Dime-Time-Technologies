workflows:
  ios_build_info:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic iOS Build

    environment:
      ios_signing:
        provisioning_profiles:
          - Dime App Store
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web + server
        script: npm run build

      - name: Verify Vite output
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ ERROR: dist/public missing — Vite build failed."
            exit 1
          fi
          echo "✔ dist/public exists"

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Increment iOS build number
        script: |
          cd ios/App
          NEW_BUILD=$((CURRENT_PROJECT_VERSION + 1))
          echo "Updating build number to $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD
          cd ../..

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            archive

      - name: Export .ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa

