workflows:
  ios_build:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      node: 20
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.dimetime.mobile"

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web + server
        script: npm run build

      - name: Verify Vite output
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ ERROR: dist/public missing"
            exit 1
          fi
          echo "✔ dist/public exists"

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Increment iOS build number
        script: |
          cd ios/App
          CURRENT_BUILD=$(agvtool what-version -terse)
          NEW_BUILD=$((CURRENT_BUILD + 1))
          agvtool new-version -all $NEW_BUILD
          cd ../..

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Set up code signing profiles in Xcode project
        script: |
          echo "=== Setting up code signing with Codemagic ios_signing profiles ==="
          xcode-project use-profiles
          echo "✔ Profiles set up"
          echo "Available provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No provisioning profiles found"

      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=8WZHH537SU \
            archive

      - name: Export .ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.plist \
            -allowProvisioningUpdates

      - name: Publish to App Store Connect (TestFlight)
        script: |
          echo "=== Uploading IPA to App Store Connect (TestFlight) ==="
          
          # Verify IPA exists
          if [ ! -f "build/ios/ipa/App.ipa" ]; then
            echo "❌ IPA file not found at build/ios/ipa/App.ipa"
            exit 1
          fi
          echo "✔ IPA found: $(ls -lh build/ios/ipa/App.ipa)"
          
          # Verify credentials
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "❌ APP_STORE_CONNECT_KEY_ID is empty"
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "❌ APP_STORE_CONNECT_ISSUER_ID is empty"
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "❌ APP_STORE_CONNECT_PRIVATE_KEY is empty"
            exit 1
          fi
          
          echo "✔ Credentials verified"
          echo "  Key ID: $APP_STORE_CONNECT_KEY_ID"
          echo "  Issuer ID: $APP_STORE_CONNECT_ISSUER_ID"
          echo "  Private key: $APP_STORE_CONNECT_PRIVATE_KEY"
          
          # Publish to App Store Connect
          set -x  # Enable debug output
          app-store-connect publish \
            --path build/ios/ipa/App.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY"
          PUBLISH_EXIT_CODE=$?
          set +x
          
          if [ $PUBLISH_EXIT_CODE -eq 0 ]; then
            echo "✅ IPA successfully uploaded to TestFlight!"
          else
            echo "❌ Publishing failed with exit code: $PUBLISH_EXIT_CODE"
            exit $PUBLISH_EXIT_CODE
          fi

    artifacts:
      - build/ios/ipa/*.ipa
