workflows:
  ios_build:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic iOS Build

    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      node: 20
      cocoapods: default

      ios_signing:
        distribution_certificate:
          keychain_path: "$HOME/Library/Keychains/login.keychain-db"
          certificate_path: "certs/DimeTime_Distribution.p12"
          certificate_password: $CERT_PASSWORD
        provisioning_profiles:
          - DimeTimeAppStore

    scripts:

      # 1. Install dependencies
      - name: Install dependencies
        script: npm ci

      # 2. Build web + server
      - name: Build project
        script: npm run build

      # 3. Sync Capacitor iOS
      - name: Sync Capacitor iOS
        script: npx cap sync ios

      # 4. Increment build number
      - name: Increment iOS build number
        script: |
          cd ios/App
          CURRENT_BUILD=$(agvtool what-version -terse)
          NEW_BUILD=$((CURRENT_BUILD + 1))
          agvtool new-version -all $NEW_BUILD
          cd ../..

      # 5. Install CocoaPods
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..

      # 6. Build archive with MANUAL signing
      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=8WZHH537SU \
            PROVISIONING_PROFILE_SPECIFIER="DimeTimeAppStore" \
            archive

      # 7. Export .ipa for App Store
      - name: Export .ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
