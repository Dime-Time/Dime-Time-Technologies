workflows:
  ios_release:
    name: Dime Time – iOS IPA Build + TestFlight Upload (Apple ID)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

      # Code signing via Apple Developer Portal integration
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.dimetime.mobile"

      # Environment group that must contain:
      #   APPLE_ID
      #   APP_SPECIFIC_PASSWORD
      #   (and any other iOS/App Store vars you use)
      groups:
        - ios_build_info

      vars:
        # Xcode project settings
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          set -e
          echo "=== Installing npm dependencies and syncing Capacitor ==="
          npm ci || npm install
          npm run build
          npx cap sync ios

          echo "=== Installing CocoaPods dependencies ==="
          bundle install || true
          cd ios/App
          pod install --repo-update
          cd ../../

      - name: Apply Codemagic signing profiles to Xcode project
        script: |
          set -e
          echo "=== Applying Codemagic signing profiles ==="
          xcode-project use-profiles

      - name: Bump iOS build number (CFBundleVersion via agvtool)
        script: |
          set -e
          cd ios/App

          # CFBundleVersion must be strictly > the last value Apple accepted.
          # History of rejections we've hit:
          #   - April 2026: hardcoded 110 → rejected, Apple had 110 on file
          #   - May 2026:   hardcoded 200 → rejected, Apple had 200 on file
          #
          # Fix: derive the build number from Codemagic's auto-incrementing
          # $BUILD_NUMBER counter, offset above the highest value ever
          # uploaded (currently 200). Every Codemagic build is guaranteed to
          # produce a monotonically increasing CFBundleVersion with no manual
          # editing required.
          #
          # BUILD_NUMBER_OFFSET should be raised ONLY if Apple ever has a
          # CFBundleVersion on file that is >= ($BUILD_NUMBER + offset).
          BUILD_NUMBER_OFFSET=210
          NEW_BUILD_NUMBER=$((${BUILD_NUMBER:-1} + BUILD_NUMBER_OFFSET))

          echo "=== Codemagic BUILD_NUMBER=${BUILD_NUMBER:-1}, offset=${BUILD_NUMBER_OFFSET} ==="
          echo "=== Setting iOS build number (CFBundleVersion) to $NEW_BUILD_NUMBER with agvtool ==="
          /usr/bin/xcrun agvtool new-version -all "$NEW_BUILD_NUMBER"

          echo "=== Forcing CFBundleVersion via PlistBuddy (belt-and-suspenders for Capacitor projects) ==="
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" "App/Info.plist"

          echo "=== Verifying CFBundleVersion in Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "App/Info.plist"

      - name: Build and export IPA
        script: |
          set -e
          echo "=== Building IPA with xcode-project build-ipa ==="
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload IPA to App Store Connect (TestFlight, Apple ID)
        script: |
          set -e
          echo "=== Uploading App.ipa to App Store Connect (TestFlight, Apple ID) ==="

          if [ -z "$APPLE_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ]; then
            echo "ERROR: APPLE_ID or APP_SPECIFIC_PASSWORD is not set."
            exit 1
          fi

          IPA_PATH="build/ios/ipa/App.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA not found at $IPA_PATH"
            ls -R build || true
            exit 1
          fi

          echo "Using APPLE_ID: ********"
          ALTOOL_PATH="$(xcrun --find altool || echo '/Applications/Xcode-26.1.app/Contents/SharedFrameworks/ContentDelivery.framework/Resources/altool')"
          echo "Using altool at: $ALTOOL_PATH"

          "$ALTOOL_PATH" --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_SPECIFIC_PASSWORD" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/**
