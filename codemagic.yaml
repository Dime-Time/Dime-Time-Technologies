workflows:
  ios_build:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      node: 20
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.dimetime.mobile"

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web + server
        script: npm run build

      - name: Verify Vite output
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ ERROR: dist/public missing"
            exit 1
          fi
          echo "✔ dist/public exists"

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Increment iOS build number
        script: |
          cd ios/App
          CURRENT_BUILD=$(agvtool what-version -terse)
          NEW_BUILD=$((CURRENT_BUILD + 1))
          agvtool new-version -all $NEW_BUILD
          cd ../..

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Set up code signing profiles in Xcode project
        script: |
          echo "=== Setting up code signing with Codemagic ios_signing profiles ==="
          xcode-project use-profiles

      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=8WZHH537SU \
            archive

      - name: Export .ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.plist

      - name: Publish to App Store Connect (TestFlight)
        script: |
          echo "=== Uploading IPA to App Store Connect (TestFlight) ==="
          
          # Decode base64-encoded private key from environment variable
          PRIVATE_KEY_FILE="/tmp/app_store_key.p8"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 -d > "$PRIVATE_KEY_FILE"
          
          if [ ! -f "$PRIVATE_KEY_FILE" ] || [ ! -s "$PRIVATE_KEY_FILE" ]; then
            echo "❌ Failed to decode private key"
            exit 1
          fi
          
          echo "✔ Private key decoded successfully"
          
          # Publish to App Store Connect
          app-store-connect publish \
            --path build/ios/ipa/App.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$PRIVATE_KEY_FILE"
          
          # Clean up
          rm -f "$PRIVATE_KEY_FILE"

    artifacts:
      - build/ios/ipa/*.ipa
