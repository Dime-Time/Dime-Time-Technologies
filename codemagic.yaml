workflows:
  ios_build:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      node: 20
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.dimetime.mobile"

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web + server
        script: npm run build

      - name: Verify Vite output
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ ERROR: dist/public missing"
            exit 1
          fi
          echo "✔ dist/public exists"

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Increment iOS build number
        script: |
          cd ios/App
          CURRENT_BUILD=$(agvtool what-version -terse)
          NEW_BUILD=$((CURRENT_BUILD + 1))
          agvtool new-version -all $NEW_BUILD
          cd ../..

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=8WZHH537SU \
            archive

      - name: Export .ipa
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/exportOptions.plist

      - name: Publish to App Store Connect
        script: |
          # Convert escaped newlines to actual newlines and save to file
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/private_key.p8
          chmod 600 /tmp/private_key.p8
          
          # Verify the key is in proper PEM format
          if head -1 /tmp/private_key.p8 | grep -q "BEGIN PRIVATE KEY"; then
            echo "✅ Key format valid"
          else
            echo "❌ Key format invalid - key does not start with BEGIN PRIVATE KEY"
            cat /tmp/private_key.p8 | head -3
            exit 1
          fi
          
          # Publish to TestFlight
          app-store-connect publish \
            --path build/ios/ipa/App.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key /tmp/private_key.p8

    artifacts:
      - build/ios/ipa/*.ipa
