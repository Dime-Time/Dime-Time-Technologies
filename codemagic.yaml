workflows:
  ios-automatic-signing:
    name: iOS App Store Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.dimetime.app"
        TEAM_ID: "8WZHH537SU"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync iOS
        script: npx cap sync ios
      - name: Set build number to 26
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 26" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist
          echo "Build version updated to 1.0.1 (26)"
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Build and archive with xcodebuild
        script: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$HOME/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$HOME/App.xcarchive" \
            -exportPath "$HOME/output" \
            -exportOptionsPlist "$CM_BUILD_DIR/build-config/ExportOptions.plist" \
            -allowProvisioningUpdates
      - name: Move IPA to artifacts
        script: |
          mkdir -p build/ios/ipa
          cp "$HOME/output/"*.ipa build/ios/ipa/ || echo "No IPA found"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/output/*.ipa
    publishing:
      app_store_connect:
        auth: key
        submit_to_testflight: true
        beta_groups:
          - Internal Testing
