workflows:
  ios_build_info:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic iOS Build

    environment:
      ios_signing:
        provisioning_profiles:
          - Dime App Store
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      # 1. Install root dependencies
      - name: Install root dependencies
        script: npm ci

      # 2. Build frontend (Vite)
      - name: Build frontend (Vite)
        script: |
          cd client
          npm ci
          npm run build
          cd ..

      # 3. Build backend (server)
      - name: Build backend (server)
        script: |
          npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist

      # 4. Verify dist/public exists
      - name: Verify web assets exist
        script: |
          if [ ! -f dist/public/index.html ]; then
            echo "❌ dist/public missing — Vite build failed."
            exit 1
          else
            echo "✔ dist/public found."
          fi

      # 5. Sync iOS (Capacitor)
      - name: Sync iOS
        script: |
          npx cap sync ios

      # 6. Set build number
      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 40" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist
          echo "Build version updated to 1.0.1 (40)"

      # 7. Install CocoaPods
      - name: Install CocoaPods
        script: cd ios/App && pod install

      # 8. Set up code signing
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      # 9. Build IPA
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
