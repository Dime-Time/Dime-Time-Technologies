workflows:
  ios-automatic-signing:
    name: iOS App Store Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        BUNDLE_ID: "com.dimetime.app"
        XCODE_SCHEME: "App"
        XCODE_CONFIGURATION: "Release"
        TEAM_ID: "8WZHH537SU"
        PROJECT_DIR: "ios/App"
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dimetime.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync iOS
        script: npx cap sync ios
      - name: Set build number to 26
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 26" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" ios/App/App/Info.plist
          echo "Build version updated to 1.0.1 (26)"
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Archive
        script: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          WORKSPACE="$(ls -1 *.xcworkspace 2>/dev/null | head -n1 || true)"
          CONFIG="${XCODE_CONFIGURATION:-Release}"
          [ -z "${XCODE_SCHEME:-}" ] && { echo "ERROR: XCODE_SCHEME is not set."; exit 1; }
          ARCHIVE_PATH="$CM_BUILD_DIR/App.xcarchive"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -allowProvisioningUpdates
      - name: Export IPA
        script: |
          set -euo pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/App.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build"
          
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist build-config/ExportOptions.plist \
            -allowProvisioningUpdates
    artifacts:
      - $CM_BUILD_DIR/build/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
