workflows:
  ios-workflow:
    name: iOS Build & TestFlight Upload

    environment:
      groups:
        - ios_build_info

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      ios_signing:
        distribution_certificate:
          certificate: Certificates/dimetimedistribution.p12
          password: $CERTIFICATE_PASSWORD
        provisioning_profile:
          app_store: Profiles/DimeTimeAppStore.mobileprovision

    scripts:
      - name: Clean CocoaPods
        script: |
          cd ios/App
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER=DimeTimeAppStore \
            archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportOptionsPlist build-config/ExportOptions.plist \
            -exportPath build/ios

      - name: Upload to TestFlight
        script: |
          xcrun altool \
            --upload-app \
            --type ios \
            -f build/ios/App.ipa \
            --apiKey $APP_STORE_CONNECT_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID

    artifacts:
      - build/ios/*.ipa
      - build/ios/**/*.dSYM
