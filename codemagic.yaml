workflows:
  ios_release:
    name: Dime Time – iOS IPA Build + TestFlight Upload (Apple ID)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

      # Code signing via Apple Developer Portal integration on Codemagic
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.dimetime.mobile"

      # Variable group in Codemagic containing your secrets
      # Required here:
      #   APPLE_ID                -> your Apple Developer email
      #   APP_SPECIFIC_PASSWORD   -> app-specific password from appleid.apple.com
      # Optional / ignored for this workflow:
      #   APP_STORE_CONNECT_*     -> safe to leave in the same group
      groups:
        - ios_build_info

      vars:
        # Xcode project settings
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

        # Must be higher than the last uploaded CFBundleVersion (you saw 44 in the error)
        IOS_BUILD_NUMBER: "49"

    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          echo "=== Installing npm dependencies and syncing Capacitor ==="
          npm ci || npm install
          npm run build
          npx cap sync ios

          echo "=== Installing CocoaPods dependencies ==="
          bundle install || true
          cd ios/App
          pod install --repo-update
          cd ../../

      - name: Set iOS build number (CFBundleVersion)
        script: |
          echo "=== Setting CFBundleVersion to $IOS_BUILD_NUMBER ==="
          INFO_PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "$INFO_PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $IOS_BUILD_NUMBER" "$INFO_PLIST"

          echo "=== Current CFBundleVersion in Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"

      - name: Apply Codemagic signing profiles to Xcode project
        script: |
          echo "=== Applying Codemagic signing profiles ==="
          xcode-project use-profiles

      - name: Build and export IPA
        script: |
          echo "=== Building IPA with xcode-project build-ipa ==="
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload IPA to App Store Connect (TestFlight, Apple ID)
        script: |
          echo "=== Uploading App.ipa to App Store Connect (TestFlight, Apple ID) ==="

          if [ -z "$APPLE_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ]; then
            echo "ERROR: APPLE_ID or APP_SPECIFIC_PASSWORD is not set."
            exit 1
          fi

          echo "Using APPLE_ID: $APPLE_ID"

          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/App.ipa \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --show-progress

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_EXPORT_DIR/**
