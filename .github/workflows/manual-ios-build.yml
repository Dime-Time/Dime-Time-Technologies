name: Manual iOS Signed Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    env:
      CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
      CERT_P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web app
      run: npm run build
      
    - name: Setup iOS
      run: |
        npm install -g @capacitor/cli
        npx cap sync ios
        cd ios/App && pod install
        
    - name: Import certificate and provisioning profile
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ secrets.IOS_CERT_P12_B64 }}
        p12-password: ${{ secrets.IOS_CERT_P12_PASSWORD }}
        create-keychain: true
        
    - name: Install provisioning profile
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "${{ secrets.IOS_PROFILE_B64 }}" | base64 -d > profile.mobileprovision
        UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i profile.mobileprovision))
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
        echo "Installed provisioning profile with UUID: $UUID"
        
    - name: Verify signing setup
      run: |
        echo "=== Available signing identities ==="
        security find-identity -v -p codesigning
        echo "=== Installed provisioning profiles ==="
        ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
        
    - name: Build and archive
      run: |
        cd ios/App
        xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath App.xcarchive \
          DEVELOPMENT_TEAM=$TEAM_ID \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="Dime Time App Store Profile" \
          archive
          
    - name: Export IPA
      run: |
        cd ios/App
        xcodebuild \
          -exportArchive \
          -archivePath App.xcarchive \
          -exportOptionsPlist ../../build-config/ExportOptions.plist \
          -exportPath ./build
          
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Dime-Time-v1.0.1.ipa
        path: ios/App/build/*.ipa